# AI Employee dashboard behind nginx, with Cloudflare proxying in "Full (strict)" mode.
#
# 1) Certificate. Either an HTTP challenge through port 80 (needs this site's port-80 block live first):
#      sudo certbot certonly --webroot -w /var/www/letsencrypt -d ai.example.com
#    or a DNS challenge with a Cloudflare token (Zone:DNS:Edit on this zone only) in a mode-600 file holding
#    `dns_cloudflare_api_token = ...`:
#      sudo certbot certonly --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini -d ai.example.com
#
# 2) Site (5173 = development: Vite dev server, 7717 = production: npm start):
#      sudo cp deploy/nginx/ai-employee.conf /etc/nginx/sites-available/ai-employee
#      sudo sed -i 's/__DOMAIN__/ai.example.com/g; s/__UPSTREAM_PORT__/5173/g' /etc/nginx/sites-available/ai-employee
#      sudo ln -s /etc/nginx/sites-available/ai-employee /etc/nginx/sites-enabled/ai-employee
#      sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $aie_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name __DOMAIN__;

  # Let's Encrypt HTTP-01 challenges and renewals (certbot --webroot -w /var/www/letsencrypt)
  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name __DOMAIN__;

  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # The agents' memory endpoint and model gateway are for local processes only.
  location = /mcp {
    return 404;
  }
  location ^~ /llm/ {
    return 404;
  }

  location / {
    proxy_pass http://127.0.0.1:__UPSTREAM_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (never append) so clients cannot spoof the address used for login rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $aie_connection_upgrade;
    # The live timeline (SSE) and Vite hot reload need unbuffered, long-lived connections.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
