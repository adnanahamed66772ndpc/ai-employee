name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard or missing today? For example, "I can't see what a task will cost before it starts."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work.
  - type: textarea
    id: alternatives
    attributes:
      label: Other options you considered
