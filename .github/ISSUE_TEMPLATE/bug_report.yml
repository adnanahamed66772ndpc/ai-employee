name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security problems here. See SECURITY.md. Remove API keys, passwords and private code from logs before you paste them."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Add a project …\n2. Start a task …\n3. See …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Run log or server output
      description: The relevant part of the task's run log or `pm2 logs`.
      render: text
  - type: input
    id: version
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD`.
  - type: dropdown
    id: setup
    attributes:
      label: Where it runs
      options:
        - Local machine
        - Linux server with the agent user
        - Linux server without the agent user
